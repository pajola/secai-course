[project]
name = "nora-demo"
version = "0.1.0"
description = "SecAI+ M06 demo: hardening a naked RAG chatbot, one trust boundary at a time"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "ollama>=0.4",
    "chromadb>=0.5",
    "httpx>=0.27",
    "rich>=13",
    "limits>=3.13",
    "tiktoken>=0.8",
    "torch>=2.4",
    "transformers>=4.45",
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",
    "en-core-web-sm",
    "structlog>=24",
]

# CPU-only PyTorch wheels (avoids downloading CUDA libraries)
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
